server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every JS/CSS chunk with a content hash in its filename
    # (e.g. index-a1b2c3d4.js), so a given filename's content never changes - safe to tell
    # the browser to cache these for a year without ever revalidating.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is what points the browser at the CURRENT hashed asset filenames, so it must
    # never be served stale from cache - otherwise, after a new deploy, a browser could keep
    # using an old index.html referencing asset files that no longer exist on disk.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
